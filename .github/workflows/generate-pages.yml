name: Generate SEO Pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-pages.py'
      - '.github/workflows/generate-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate pages
        run: python3 scripts/generate-pages.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Generate distinct SEO landing pages'
            git push
          fi
